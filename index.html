<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cine Mundo BHS - Mobile & PC</title>
    
    <link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" href="favicon.png" sizes="180x180">
    <meta name="description" content="Assista a filmes, séries, animes e canais de TV ao vivo no Cine Mundo BHS com carregamento instantâneo e histórico integrado.">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: #0d1326;
            --bg-sidebar: #090e1c;
            --accent-red: #e50914;
            --text-main: #ffffff;
            --text-muted: #7887a0;
            --accent-green: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR / NAVBAR MOBILE */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.05);
            z-index: 999;
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-red);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .menu-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 15px 0 5px 0;
        }

        .menu-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .menu-item:hover, .menu-item.active {
            background-color: rgba(229, 9, 20, 0.1);
            color: var(--text-main);
        }

        .menu-item.active {
            border-left: 4px solid var(--accent-red);
        }

        /* CONTEÚDO PRINCIPAL */
        .main-content {
            flex: 1;
            padding: 30px;
            padding-bottom: 100px;
        }

        /* BARRA SUPERIOR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 500px;
            min-width: 260px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 20px;
            background-color: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(229,9,20,0.2);
        }

        .server-selector {
            background-color: var(--bg-card);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        /* FILTROS DE CATEGORIA */
        .filter-wrapper {
            margin-bottom: 25px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 5px;
        }

        .filter-wrapper::-webkit-scrollbar {
            height: 4px;
        }

        .filter-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        .filter-badge {
            display: inline-block;
            padding: 8px 16px;
            background-color: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            margin-right: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .filter-badge:hover, .filter-badge.active {
            background-color: var(--accent-red);
            color: white;
            border-color: var(--accent-red);
        }

        /* VITRINE / CARDS */
        .grid-catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            border: 1px solid rgba(255,255,255,0.03);
            display: flex;
            flex-direction: column;
            aspect-ratio: 2/3;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(6,9,19,0.95) 60%);
            padding: 30px 12px 12px 12px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 2;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        .card-group {
            font-size: 10px;
            color: var(--accent-green);
            font-weight: 600;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* TELAS DE ESTADO */
        .status-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* VIEW PLAYER INTEGRADO */
        #view-player {
            display: none;
            padding: 20px 0;
        }

        .player-wrapper {
            max-width: 960px;
            margin: 0 auto;
            background-color: black;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
        }

        video {
            width: 100%;
            aspect-ratio: 16/9;
            display: block;
            outline: none;
        }

        .player-details {
            padding: 20px;
            background-color: var(--bg-card);
        }

        .player-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(255,255,255,0.06);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 13px;
            transition: background 0.2s;
        }

        .player-back-btn:hover {
            background-color: rgba(255,255,255,0.15);
        }

        /* RESPONSIVIDADE SENSÍVEL */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.05);
                padding: 15px;
            }
            .brand {
                margin-bottom: 15px;
                justify-content: center;
            }
            .menu-label {
                display: none;
            }
            .sidebar-menu {
                display: flex;
                justify-content: space-around;
                flex-wrap: wrap;
                gap: 5px;
            }
            .menu-item {
                margin-bottom: 0;
                padding: 8px 12px;
                font-size: 12px;
            }
            .main-content {
                padding: 15px;
            }
            .grid-catalogo {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 12px;
            }
            .card-info {
                padding: 8px;
            }
            .card-title {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="brand" onclick="irParaHome()">🍿 Cine Mundo</div>
            <div class="sidebar-menu">
                <div class="menu-label">Navegação</div>
                <div class="menu-item active" id="menu-tv" onclick="mudarTipo('tv')">📺 Canais Ao Vivo</div>
                <div class="menu-item" id="menu-24h" onclick="mudarTipo('24h')">⏰ Canais 24 Horas</div>
                <div class="menu-item" id="menu-filme" onclick="mudarTipo('filme')">🎬 Filmes Recentes</div>
                <div class="menu-item" id="menu-series" onclick="mudarTipo('series')">🍿 Séries & Novelas</div>
                <div class="menu-item" id="menu-anime" onclick="mudarTipo('anime')">👾 Desenhos & Animes</div>
            </div>
        </div>

        <div class="main-content">
            
            <div id="view-player">
                <div class="player-back-btn" onclick="fecharPlayer()">⬅ Voltar ao Catálogo</div>
                <div class="player-wrapper">
                    <video id="native-player" controls autoplay playsinline></video>
                </div>
                <div class="player-details">
                    <h2 id="player-stream-title" style="margin-bottom:5px;">Nome do Conteúdo</h2>
                    <p id="player-stream-group" style="color:var(--accent-green); font-size:14px; font-weight:600;">Categoria</p>
                </div>
            </div>

            <div id="view-catalogo">
                <div class="top-bar">
                    <div class="search-box">
                        <input type="text" id="input-busca" placeholder="Pesquisar canais, filmes ou séries..." oninput="filtrarDados()">
                    </div>
                    <select id="select-servidores" class="server-selector" onchange="trocarServidorAtivo(this.value)"></select>
                </div>

                <div class="filter-wrapper" id="container-categorias-lista"></div>

                <div id="status-tela"></div>
                <div class="grid-catalogo" id="grid-elementos"></div>
            </div>

        </div>
    </div>

    <script src="lista.js"></script>

    <script>
        let tipoAtual = 'tv';
        let categoriaFiltroAtiva = 'TODOS';
        let listaGeralDaMemoria = [];
        let hlsInstance = null;

        function inicializarSeletorServidores() {
            const select = document.getElementById('select-servidores');
            select.innerHTML = "";
            Object.keys(XTREAM_SERVIDORES).forEach(chave => {
                const opt = document.createElement('option');
                opt.value = chave;
                opt.textContent = XTREAM_SERVIDORES[chave].nome;
                select.appendChild(opt);
            });
        }

        async function trocarServidorAtivo(chave) {
            if (XTREAM_SERVIDORES[chave]) {
                XTREAM_CONFIG = XTREAM_SERVIDORES[chave];
                await iniciar();
            }
        }

        function mostrarStatus(mensagem, exibirSpinner = true) {
            const statusTela = document.getElementById('status-tela');
            const grid = document.getElementById('grid-elementos');
            grid.innerHTML = "";
            
            if (!mensagem) {
                statusTela.innerHTML = "";
                return;
            }

            statusTela.innerHTML = `
                <div class="status-container">
                    ${exibirSpinner ? '<div class="spinner"></div>' : ''}
                    <div class="status-text">${mensagem}</div>
                </div>
            `;
        }

        async function iniciar() {
            fecharPlayer();
            mostrarStatus("Sincronizando dados com o painel remoto...");
            
            try {
                // AGUARDA CORRETAMENTE O RETORNO DO LISTA.JS
                const resultado = await carregarDadosXtream();
                listaGeralDaMemoria = Array.isArray(resultado) ? resultado : [];
                
                if (listaGeralDaMemoria.length === 0) {
                    mostrarStatus("Nenhum conteúdo disponível neste servidor ou erro na conexão do painel.", false);
                    renderizerAbasFiltros([]);
                } else {
                    mostrarStatus(null);
                    categoriaFiltroAtiva = 'TODOS';
                    renderizerCategorias();
                }
            } catch (e) {
                console.error(e);
                mostrarStatus("Erro crítico ao sincronizar dados.", false);
            }
        }

        function mudarTipo(novoTipo) {
            tipoAtual = novoTipo;
            categoriaFiltroAtiva = 'TODOS';
            
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            const menuAtivo = document.getElementById(`menu-${novoTipo}`);
            if (menuAtivo) menuAtivo.classList.add('active');

            fecharPlayer();
            renderizerCategorias();
        }

        function renderizerCategorias() {
            const filtradosPorTipo = listaGeralDaMemoria.filter(item => item.tipoOriginal === tipoAtual);
            
            const listaCategoriasUnicas = ['TODOS'];
            filtradosPorTipo.forEach(item => {
                if (item.group && !listaCategoriasUnicas.includes(item.group)) {
                    listaCategoriasUnicas.push(item.group);
                }
            });

            renderizerAbasFiltros(listaCategoriasUnicas);
            filtrarDados();
        }

        function renderizerAbasFiltros(categorias) {
            const container = document.getElementById('container-categorias-lista');
            container.innerHTML = "";
            
            categorias.forEach(cat => {
                const badge = document.createElement('div');
                badge.className = `filter-badge ${categoriaFiltroAtiva === cat ? 'active' : ''}`;
                badge.textContent = cat;
                badge.onclick = () => {
                    categoriaFiltroAtiva = cat;
                    document.querySelectorAll('.filter-badge').forEach(b => b.classList.remove('active'));
                    badge.classList.add('active');
                    filtrarDados();
                };
                container.appendChild(badge);
            });
        }

        function filtrarDados() {
            const busca = document.getElementById('input-busca').value.toLowerCase().trim();
            const grid = document.getElementById('grid-elementos');
            grid.innerHTML = "";

            let resultado = listaGeralDaMemoria.filter(item => item.tipoOriginal === tipoAtual);

            if (categoriaFiltroAtiva !== 'TODOS') {
                resultado = resultado.filter(item => item.group === categoriaFiltroAtiva);
            }

            if (busca) {
                resultado = resultado.filter(item => 
                    item.nome.toLowerCase().includes(busca) || 
                    (item.group && item.group.toLowerCase().includes(busca))
                );
            }

            if (resultado.length === 0) {
                mostrarStatus("Nenhum conteúdo correspondente encontrado.", false);
                return;
            }

            mostrarStatus(null);

            resultado.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => abrirPlayer(item.url, item.nome, item.group);

                card.innerHTML = `
                    <img src="${item.logo}" data-id-capa="${item.id_unico || ''}" onerror="this.src='https://images.tmdb.org/t/p/w500/orS79T06mX6Zmdorv5g7Zf7fV4B.jpg'">
                    <div class="card-info">
                        <div class="card-title">${item.nome}</div>
                        <div class="card-group">${item.group || ''}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function abrirPlayer(url, nome, grupo) {
            document.getElementById('view-catalogo').style.display = 'none';
            document.getElementById('view-player').style.display = 'block';
            
            document.getElementById('player-stream-title').textContent = nome;
            document.getElementById('player-stream-group').textContent = grupo || "";

            const video = document.getElementById('native-player');
            video.pause();
            
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (url) {
                if (url.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        hlsInstance = new Hls();
                        hlsInstance.loadSource(url);
                        hlsInstance.attachMedia(video);
                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                        video.play().catch(()=>{});
                    }
                } else {
                    video.src = url;
                    video.play().catch(() => console.log("Aguardando reprodução."));
                }
            }
        }

        function fecharPlayer() {
            document.getElementById('view-player').style.display = 'none';
            document.getElementById('view-catalogo').style.display = 'block';
            const video = document.getElementById('native-player');
            video.pause();
            video.src = "";
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
        }

        function irParaHome() {
            fecharPlayer();
            renderizerCategorias();
        }

        window.onload = function() {
            inicializarSeletorServidores();
            iniciar();
        };
    </script>
</body>
</html>
