<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cine Mundo BHS - Mobile & PC</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: #0d1326;
            --bg-sidebar: #090e1c;
            --accent-red: #e50914;
            --text-main: #ffffff;
            --text-muted: #7887a0;
            --accent-green: #2ecc71;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 30px; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        
        header { 
            background: #090e1c; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            border-bottom: 1px solid #141c33; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            width: 100%;
        }

        .header-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%; 
            gap: 10px; 
        }

        .logo { 
            font-size: 1.2rem; 
            font-weight: 700; 
            color: #fff; 
            text-transform: uppercase; 
            cursor: pointer; 
            white-space: nowrap; 
        }
        .logo span { color: var(--accent-red); }

        .server-select { 
            background: var(--accent-red); 
            color: #fff; 
            border: none; 
            padding: 8px 10px; 
            border-radius: 6px; 
            outline: none; 
            font-size: 0.8rem; 
            font-weight: 600; 
            cursor: pointer;
            max-width: 160px;
        }

        .nav-tabs { 
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            white-space: nowrap; 
            width: 100%; 
            padding-bottom: 6px; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: thin;
            scrollbar-color: var(--accent-red) transparent;
        }

        .nav-tabs::-webkit-scrollbar { height: 4px; }
        .nav-tabs::-webkit-scrollbar-thumb { background: var(--accent-red); border-radius: 10px; }

        .tab-btn { 
            background: #0d1326; 
            border: 1px solid #1a243d; 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            font-weight: 600; 
            cursor: pointer; 
            padding: 8px 14px; 
            border-radius: 20px; 
            flex-shrink: 0; 
            display: inline-block;
        }

        .tab-btn.active, .tab-btn:hover { 
            color: var(--text-main); 
            background: var(--accent-red); 
            border-color: var(--accent-red); 
        }

        .search-box { width: 100%; display: flex; }
        .search-box input { 
            width: 100%; 
            padding: 10px 16px; 
            background: #0d1326; 
            border: 1px solid #1a243d; 
            border-radius: 25px; 
            color: #fff; 
            outline: none; 
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .container { max-width: 1600px; margin: 20px auto; padding: 0 15px; }
        .section-title { font-size: 1.3rem; margin-bottom: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; display: inline-block; width: 4px; height: 20px; background: var(--accent-red); }
        
        .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        
        .category-card { background: linear-gradient(135deg, #141c33, #0d1326); padding: 20px 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 1px solid #1a243d; min-height: 110px; display: flex; flex-direction: column; justify-content: center; }
        .category-card:hover { border-color: var(--accent-red); }
        .category-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 5px; }
        .category-count { font-size: 0.75rem; color: var(--text-muted); }

        .content-card { background: var(--bg-card); border-radius: 10px; overflow: hidden; border: 1px solid #141c33; position: relative; display: flex; flex-direction: column; }
        .content-card-img { width: 100%; height: 200px; background: #141c33; cursor: pointer; }
        .content-card-img img { width: 100%; height: 100%; object-fit: cover; }
        .content-card-info { padding: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .content-card-title { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; cursor: pointer; }
        
        .info-badge-btn { background: #1a243d; color: #fff; border: none; width: 24px; height: 24px; border-radius: 50%; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; }
        .info-badge-btn:hover { background: var(--accent-red); }

        #view-player { display: none; }
        .player-view { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 15px; }
        .video-container { background: #000; border-radius: 12px; overflow: hidden; padding: 5px; }
        video { width: 100%; height: auto; max-height: 450px; border-radius: 8px; outline: none; background: #000; }
        
        .sidebar { background: var(--bg-sidebar); border-radius: 12px; border: 1px solid #141c33; display: flex; flex-direction: column; max-height: 400px; }
        .sidebar-title { font-weight: 600; padding: 12px 15px; border-bottom: 1px solid #141c33; font-size: 0.95rem; }
        .stream-list { overflow-y: auto; flex: 1; padding: 10px; }
        .stream-item { padding: 12px; background: #0d1326; margin-bottom: 8px; border-radius: 8px; font-size: 0.85rem; border: 1px solid #1a243d; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .stream-item-text { flex: 1; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
        
        .watched-eye { color: var(--text-muted); opacity: 0.3; font-size: 0.9rem; transition: 0.2s; }
        .stream-item.watched .watched-eye { color: var(--accent-green); opacity: 1; }

        .stream-actions { display: flex; align-items: center; gap: 8px; }
        .stream-item:hover, .stream-item.active { border-color: var(--accent-red); }
        .stream-item.active { background: #141c33; border-color: var(--accent-red); }
        
        .back-btn { background: #0d1326; color: #fff; border: 1px solid #1a243d; padding: 10px 18px; border-radius: 25px; cursor: pointer; margin-bottom: 15px; font-weight: 600; font-size: 0.85rem; display: inline-block; width: 100%; text-align: center; }
        .loading { font-size: 1.1rem; text-align: center; color: var(--text-muted); padding: 40px 0; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 200; padding: 15px; }
        .modal-content { background: #0d1326; border: 1px solid #1a243d; border-radius: 16px; width: 100%; max-width: 500px; padding: 20px; position: relative; animation: modalFade 0.3s ease; display: flex; flex-direction: column; gap: 15px; }
        @keyframes modalFade { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-close { position: absolute; top: 12px; right: 15px; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .modal-body { display: flex; gap: 15px; align-items: flex-start; }
        .modal-poster { width: 100px; height: 145px; border-radius: 8px; object-fit: cover; background: #141c33; flex-shrink: 0; }
        .modal-details { flex: 1; min-width: 0; }
        .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 5px; }
        .modal-meta { display: flex; gap: 10px; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }
        .modal-overview { font-size: 0.85rem; color: #b2c1d9; line-height: 1.5; max-height: 180px; overflow-y: auto; }

        @media(min-width: 992px) {
            header { flex-direction: row; justify-content: space-between; align-items: center; padding: 15px 5%; }
            .header-top { width: auto; gap: 20px; }
            .logo { font-size: 1.5rem; }
            .nav-tabs { width: auto; overflow-x: visible; }
            .search-box { width: auto; }
            .search-box input { width: 260px; }
            .content-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
            .content-card-img { height: 250px; }
            .player-view { grid-template-columns: 1fr 380px; gap: 30px; }
            .back-btn { width: auto; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo" onclick="irParaHome()">Cine Mundo<span> BHS</span></div>
            <select id="serverSelect" class="server-select" onchange="trocarServidor(this.value)"></select>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="mudarAba('todos', this)">Todas Categorias</button>
            <button class="tab-btn" onclick="mudarAba('tv', this)">TV ao Vivo</button>
            <button class="tab-btn" onclick="mudarAba('series', this)">Séries</button>
            <button class="tab-btn" onclick="mudarAba('anime', this)">Animes</button>
            <button class="tab-btn" onclick="mudarAba('filme', this)">Filmes</button>
            <button class="tab-btn" onclick="mudarAba('24h', this)">Canais 24h</button>
        </div>

        <div class="search-box">
            <input type="text" id="search" placeholder="Buscar no Cine Mundo BHS...">
        </div>
    </header>

    <div class="container">
        <div id="view-catalogo">
            <div id="sub-nav-back" style="display:none;">
                <button class="back-btn" onclick="renderizerCategorias()">← Voltar para Categorias</button>
            </div>
            <h2 class="section-title" id="titulo-pagina">Categorias Disponíveis</h2>
            <div id="loading-msg" class="loading">Sincronizando canais e servidores...</div>
            <div class="content-grid" id="main-grid"></div>
        </div>

        <div id="view-player">
            <button class="back-btn" onclick="fecharPlayer()">← Voltar ao Catálogo</button>
            <div class="player-view">
                <div class="video-container">
                    <video id="native-player" controls autoplay playsinline onended="verificarProximoEpisodio()"></video>
                    <div style="padding: 15px 5px;">
                        <h2 id="player-title" style="font-size: 1.3rem;">Título</h2>
                        <p id="player-current-stream" style="color: var(--text-muted); margin-top: 5px; font-size: 0.85rem;"></p>
                    </div>
                </div>
                <div class="sidebar">
                    <div class="sidebar-title">Opções de Transmissão</div>
                    <div class="stream-list" id="sidebar-container"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="infoModal" onclick="fecharModalInfo(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="document.getElementById('infoModal').style.display='none'">×</button>
            <div class="modal-body">
                <img src="" id="modalImg" class="modal-poster">
                <div class="modal-details">
                    <div id="modalTitle" class="modal-title">Título</div>
                    <div class="modal-meta">
                        <span id="modalYear">----</span>
                        <span id="modalRating" style="color:#ffbc00;">⭐ --</span>
                    </div>
                    <div id="modalOverview" class="modal-overview">Carregando detalhes...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="lista.js"></script>
    <script>
        let todosItens = [];
        let mapaItens = {};
        let categoriasAgrupadas = {};
        let abaAtual = 'todos';
        let categoriaAtiva = null;
        let hlsInstance = null;

        let playlistEpisodios = [];
        let indiceEpisodioAtual = -1;

        const TMDB_KEY = "fd4dee61e7ac687a4a825cfd6f2f809c";
        const PROXY_URL = "https://corsproxy.io/?";

        function obterHistorico() {
            try { return JSON.parse(localStorage.getItem('bhs_historico_vistos')) || []; }
            catch(e) { return []; }
        }

        function salvarNoHistorico(idEpisodio) {
            let historico = obterHistorico();
            if (!historico.includes(idEpisodio)) {
                historico.push(idEpisodio);
                localStorage.setItem('bhs_historico_vistos', JSON.stringify(historico));
            }
        }

        function inicializarSeletorServidores() {
            const select = document.getElementById('serverSelect');
            select.innerHTML = '';
            if (typeof XTREAM_SERVIDORES !== 'undefined') {
                Object.keys(XTREAM_SERVIDORES).forEach(key => {
                    const option = document.createElement('option');
                    option.value = key;
                    option.innerText = XTREAM_SERVIDORES[key].nome;
                    if (XTREAM_SERVIDORES[key].server === XTREAM_CONFIG.server) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });
            }
        }

        async function trocarServidor(chaveServidor) {
            if (typeof XTREAM_SERVIDORES !== 'undefined' && XTREAM_SERVIDORES[chaveServidor]) {
                fecharPlayer();
                XTREAM_CONFIG = XTREAM_SERVIDORES[chaveServidor];
                
                const msg = document.getElementById('loading-msg');
                msg.style.display = 'block';
                msg.innerText = `Conectando ao ${XTREAM_SERVIDORES[chaveServidor].nome}...`;
                
                document.getElementById('main-grid').innerHTML = '';
                await iniciar();
            }
        }

        async function iniciar() {
            const msgElement = document.getElementById('loading-msg');
            msgElement.style.display = 'block';
            
            const timeoutSeguranca = setTimeout(() => {
                if (todosItens.length === 0) {
                    msgElement.innerText = "Este servidor está demorando muito para responder. Escolha outra opção no topo!";
                }
            }, 8000);

            try {
                todosItens = await carregarDadosXtream();
                clearTimeout(timeoutSeguranca);
                msgElement.style.display = 'none';
                
                mapaItens = {};
                categoriasAgrupadas = {};
                
                todosItens.forEach(item => {
                    mapaItens[item.id_global] = item;
                    if (!categoriasAgrupadas[item.group]) {
                        categoriasAgrupadas[item.group] = { nome: item.group, tipo: item.tipoOriginal, itens: [] };
                    }
                    categoriasAgrupadas[item.group].itens.push(item);
                });
                renderizerCategorias();
            } catch (err) {
                clearTimeout(timeoutSeguranca);
                msgElement.innerText = "Erro ao carregar este servidor. Tente mudar de servidor acima.";
            }
            document.getElementById('search').oninput = realizarBusca;
        }

        function renderizerCategorias() {
            categoriaAtiva = null;
            document.getElementById('sub-nav-back').style.display = 'none';
            document.getElementById('titulo-pagina').innerText = "Categorias do Servidor";
            
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            
            let grupos = Object.values(categoriasAgrupadas);
            if (abaAtual !== 'todos') {
                grupos = grupos.filter(g => g.tipo === abaAtual);
            }

            if(grupos.length === 0) {
                grid.innerHTML = `<div class="loading" style="grid-column: 1/-1;">Nenhum conteúdo nesta seção.</div>`;
                return;
            }

            grupos.forEach(grupo => {
                const card = document.createElement('div');
                card.classList.add('category-card');
                card.onclick = () => abrirPasta(grupo.nome);
                card.innerHTML = `
                    <div class="category-name">${grupo.nome}</div>
                    <div class="category-count">${grupo.itens.length} título(s)</div>
                `;
                grid.appendChild(card);
            });
        }

        function abrirPasta(nomeGrupo) {
            categoriaAtiva = nomeGrupo;
            document.getElementById('sub-nav-back').style.display = 'block';
            document.getElementById('titulo-pagina').innerText = nomeGrupo;

            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';

            const pasta = categoriasAgrupadas[nomeGrupo];
            if (!pasta) return;

            pasta.itens.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('content-card');
                
                card.innerHTML = `
                    <div class="content-card-img" onclick="processarCliqueConteudoById('${item.id_global}')">
                        <img src="${item.logo}" loading="lazy" onerror="this.src='https://images.tmdb.org/t/p/w500/orS79T06mX6Zmdorv5g7Zf7fV4B.jpg'">
                    </div>
                    <div class="content-card-info">
                        <div class="content-card-title" onclick="processarCliqueConteudoById('${item.id_global}')">${item.nome}</div>
                        <button class="info-badge-btn" onclick="abrirPopupInformacaoPorId('${item.id_global}')">i</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function mudarAba(aba, btn) {
            abaAtual = aba;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            renderizerCategorias();
        }

        function realizarBusca() {
            const termo = document.getElementById('search').value.toLowerCase().trim();
            const grid = document.getElementById('main-grid');

            if (termo === '') {
                if (categoriaAtiva) abrirPasta(categoriaAtiva);
                else renderizerCategorias();
                return;
            }

            document.getElementById('sub-nav-back').style.display = 'block';
            document.getElementById('titulo-pagina').innerText = `Resultados para: "${termo}"`;
            grid.innerHTML = '';

            let filtrados = todosItens.filter(x => x.nome.toLowerCase().includes(termo));
            if (abaAtual !== 'todos') {
                filtrados = filtrados.filter(x => x.tipoOriginal === abaAtual);
            }

            if (filtrados.length === 0) {
                grid.innerHTML = `<div class="loading" style="grid-column: 1/-1;">Nenhum item encontrado.</div>`;
                return;
            }

            filtrados.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('content-card');
                card.innerHTML = `
                    <div class="content-card-img" onclick="processarCliqueConteudoById('${item.id_global}')">
                        <img src="${item.logo}" loading="lazy" onerror="this.src='https://images.tmdb.org/t/p/w500/orS79T06mX6Zmdorv5g7Zf7fV4B.jpg'">
                    </div>
                    <div class="content-card-info">
                        <div class="content-card-title" onclick="processarCliqueConteudoById('${item.id_global}')">${item.nome}</div>
                        <button class="info-badge-btn" onclick="abrirPopupInformacaoPorId('${item.id_global}')">i</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function abrirPopupInformacaoPorId(idGlobal) {
            const item = mapaItens[idGlobal];
            if (item) abrirPopupInformacao(item.nome, item.tipoOriginal, item.logo);
        }

        async function abrirPopupInformacao(nomeOriginal, tipo, logoPadrao) {
            const overlay = document.getElementById('infoModal');
            document.getElementById('modalTitle').innerText = nomeOriginal;
            document.getElementById('modalImg').src = logoPadrao;
            document.getElementById('modalYear').innerText = "----";
            document.getElementById('modalRating').innerText = "⭐ --";
            document.getElementById('modalOverview').innerText = "Buscando informações oficiais...";
            overlay.style.display = 'flex';

            if (tipo === 'tv' || tipo === '24h') {
                document.getElementById('modalOverview').innerText = `Canal ao vivo: "${nomeOriginal}". Transmissão contínua em tempo real.`;
                return;
            }

            try {
                let termoBusca = nomeOriginal.replace(/\b(dublado|legendado|multi|4k|fhd|hd|720p|1080p|h264|x264|temporada|episodio|202[0-9]|201[0-9])\b/gi, "").trim();
                const tipoEndpoint = (tipo === 'series' || tipo === 'anime') ? 'tv' : 'movie';
                
                const res = await fetch(`https://api.themoviedb.org/3/search/${tipoEndpoint}?api_key=${TMDB_KEY}&query=${encodeURIComponent(termoBusca)}&language=pt-BR`);
                if (res.ok) {
                    const dados = await res.json();
                    if (dados.results && dados.results.length > 0) {
                        const info = dados.results[0];
                        document.getElementById('modalYear').innerText = (info.release_date || info.first_air_date || "----").split("-")[0];
                        document.getElementById('modalRating').innerText = `⭐ ${info.vote_average ? info.vote_average.toFixed(1) : "--"}`;
                        document.getElementById('modalOverview').innerText = info.overview || "Sinopse indisponível em português.";
                        if (info.poster_path) document.getElementById('modalImg').src = `https://image.tmdb.org/t/p/w300${info.poster_path}`;
                    } else {
                        document.getElementById('modalOverview').innerText = "Sinopse não localizada no catálogo TMDB.";
                    }
                }
            } catch (e) {
                document.getElementById('modalOverview').innerText = "Falha ao se conectar ao banco de dados do TMDB.";
            }
        }

        function fecharModalInfo(e) {
            if(e.target.classList.contains('modal-overlay') || e.target.classList.contains('modal-close')) {
                document.getElementById('infoModal').style.display = 'none';
            }
        }

        function processarCliqueConteudoById(idGlobal) {
            const item = mapaItens[idGlobal];
            if (!item) return;

            playlistEpisodios = []; 
            indiceEpisodioAtual = -1;

            if (item.tipoOriginal === 'series' || item.tipoOriginal === 'anime') {
                carregarEpisodiosSerie(item);
            } else {
                carregarPlayerFilmeOuTV(item);
            }
        }

        function carregarPlayerFilmeOuTV(item) {
            document.getElementById('view-catalogo').style.display = 'none';
            document.getElementById('view-player').style.display = 'block';
            document.getElementById('player-title').innerText = item.nome;

            const container = document.getElementById('sidebar-container');
            container.innerHTML = '';

            const el = document.createElement('div');
            el.classList.add('stream-item', 'active');
            el.innerHTML = `
                <div class="stream-item-text">Reproduzir Sinal Digital</div>
                <button class="info-badge-btn" onclick="abrirPopupInformacaoPorId('${item.id_global}')">i</button>
            `;
            container.appendChild(el);
            darPlay(item.url, item.nome, item.tipoOriginal);
        }

        async function carregarEpisodiosSerie(item) {
            document.getElementById('view-catalogo').style.display = 'none';
            document.getElementById('view-player').style.display = 'block';
            document.getElementById('player-title').innerText = item.nome;

            const container = document.getElementById('sidebar-container');
            container.innerHTML = '<div style="padding:15px;color:var(--text-muted);">Processando episódios...</div>';

            try {
                const { server, username, password } = XTREAM_CONFIG;
                
                let seriesId = item.series_id;
                if (!seriesId) {
                    const partes = item.url.split('/');
                    seriesId = partes.pop().split('.')[0];
                }
                
                const rawUrl = `${server}/player_api.php?username=${username}&password=${password}&action=get_series_info&series_id=${seriesId}`;
                const apiUrl = location.protocol === 'https:' ? PROXY_URL + encodeURIComponent(rawUrl) : rawUrl;

                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error("Erro HTTP");

                const textData = await res.text();
                let dados;
                try {
                    dados = JSON.parse(textData);
                } catch(errJson) {
                    throw new Error("O servidor retornou HTML inválido.");
                }

                container.innerHTML = '';

                if (dados && dados.episodes) {
                    let contadorIndex = 0;
                    let historicoVistos = obterHistorico();
                    
                    if (Array.isArray(dados.episodes)) {
                        dados.episodes.forEach((epList, idx) => {
                            if (Array.isArray(epList)) {
                                epList.forEach(ep => processarEpisodioUnico(ep, idx + 1, contadorIndex++, seriesId, server, username, password, container, historicoVistos));
                            }
                        });
                    } else {
                        // Correção robusta para objetos/dicionários de temporadas retornados por diferentes servidores Xtream
                        const temporadasChaves = Object.keys(dados.episodes);
                        temporadasChaves.forEach(tempNum => {
                            let listaEps = dados.episodes[tempNum];
                            if (listaEps) {
                                if (!Array.isArray(listaEps) && typeof listaEps === 'object') {
                                    listaEps = Object.values(listaEps);
                                }
                                if (Array.isArray(listaEps)) {
                                    listaEps.forEach(ep => {
                                        processarEpisodioUnico(ep, tempNum, contadorIndex++, seriesId, server, username, password, container, historicoVistos);
                                    });
                                }
                            }
                        });
                    }

                    if (playlistEpisodios.length > 0) {
                        executarEpisodioPorIndice(0);
                        return;
                    }
                }
                throw new Error("Nenhum episódio encontrado");
            } catch (err) {
                console.error("Erro ao carregar episódios:", err);
                container.innerHTML = `<div style="padding:15px;color:var(--accent-red);">Nenhum episódio localizado ou servidor indisponível.</div>`;
            }
        }

        function processarEpisodioUnico(ep, tempNum, contadorIndex, seriesId, server, username, password, container, historicoVistos) {
            const epId = ep.id || ep.stream_id || ep.episode_num;
            const epExt = ep.container_extension || 'mp4';
            
            const epUrl = `${server}/series/${username}/${password}/${epId}.${epExt}`;
            const epNumFormatado = ep.episode_num || (contadorIndex + 1);
            const epNome = `T${tempNum} - Ep. ${epNumFormatado}: ${ep.title || 'Episódio'}`;
            const uniqueEpId = `ep_${seriesId}_${epId}`;

            playlistEpisodios.push({ 
                url: epUrl, 
                nome: epNome, 
                tipo: 'vod-series', 
                index: contadorIndex,
                idHistorico: uniqueEpId 
            });

            const el = document.createElement('div');
            el.classList.add('stream-item');
            if (historicoVistos.includes(uniqueEpId)) {
                el.classList.add('watched');
            }
            el.setAttribute('data-index', contadorIndex);
            el.setAttribute('id', `dom-${uniqueEpId}`);
            el.innerHTML = `
                <div class="stream-item-text">
                    <span class="watched-eye">👁️</span>
                    <span>${epNome}</span>
                </div>
                <div class="stream-actions">
                    <button class="info-badge-btn" style="background:var(--accent-red);font-size:0.65rem;width:auto;border-radius:6px;padding:2px 8px;">PLAY</button>
                </div>
            `;
            
            const acaoPlay = () => executarEpisodioPorIndice(contadorIndex);
            el.querySelector('.stream-item-text').onclick = acaoPlay;
            el.querySelector('button').onclick = acaoPlay;

            container.appendChild(el);
        }

        function executarEpisodioPorIndice(index) {
            if (index < 0 || index >= playlistEpisodios.length) return;
            
            indiceEpisodioAtual = index;
            const ep = playlistEpisodios[index];

            salvarNoHistorico(ep.idHistorico);

            document.querySelectorAll('.stream-item').forEach(x => {
                if(parseInt(x.getAttribute('data-index')) === index) {
                    x.classList.add('active', 'watched');
                    x.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    x.classList.remove('active');
                }
            });

            darPlay(ep.url, ep.nome, ep.tipo);
        }

        function verificarProximoEpisodio() {
            if (playlistEpisodios.length > 0 && indiceEpisodioAtual !== -1) {
                const proximoIndice = indiceEpisodioAtual + 1;
                if (proximoIndice < playlistEpisodios.length) {
                    executarEpisodioPorIndice(proximoIndice);
                }
            }
        }

        function darPlay(url, nome, tipo) {
    const video = document.getElementById('native-player');
    document.getElementById('player-current-stream').innerText = `Fonte: ${nome}`;
    
    if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
    }

    video.removeAttribute('src');
    video.load();

    let targetUrl = url;
    
    // Se estiver no Netlify (HTTPS) e a lista for HTTP, o ideal para testes 
    // é tentar abrir direto ou usar um proxy dedicado a HLS.
    // Vamos tentar carregar direto se o HLS.js suportar o fetch via proxy de segmentos:
    if (location.protocol === 'https:' && targetUrl.startsWith('http:')) {
        // Trocamos para um proxy alternativo que suporta melhor headers de vídeo ou forçamos o HLS
        targetUrl = "https://corsproxy.io/?" + encodeURIComponent(targetUrl);
    }

    if (tipo === 'tv' || tipo === '24h' || targetUrl.includes('.m3u8')) {
        if (Hls.isSupported()) {
            hlsInstance = new Hls({
                xhrSetup: function (xhr, endpoint) {
                    // Força o xhr a passar pelo proxy se necessário nos segmentos do HLS
                    if (location.protocol === 'https:' && endpoint.startsWith('http:')) {
                        xhr.open('GET', "https://corsproxy.io/?" + encodeURIComponent(endpoint), true);
                    }
                }
            });
            
            hlsInstance.loadSource(targetUrl);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => console.log("Play bloqueado pelo navegador:", e));
            });
            hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                console.warn("Erro no HLS.js:", data.details);
                if (data.fatal) {
                    switch (data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.error("Erro de rede no canal ao vivo. O Netlify bloqueou o fluxo HTTP.");
                            hlsInstance.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            hlsInstance.recoverMediaError();
                            break;
                        default:
                            hlsInstance.destroy();
                            break;
                    }
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = targetUrl;
            video.play().catch(() => {});
        }
    } else {
        video.src = targetUrl;
        video.play().catch((err) => {
            console.error("Erro ao reproduzir arquivo direto:", err);
        });
    }
}

        function fecharPlayer() {
            document.getElementById('view-player').style.display = 'none';
            document.getElementById('view-catalogo').style.display = 'block';
            playlistEpisodios = [];
            indiceEpisodioAtual = -1;
            const video = document.getElementById('native-player');
            video.pause();
            video.src = "";
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
        }

        function irParaHome() {
            fecharPlayer();
            renderizerCategorias();
        }

        window.onload = function() {
            inicializarSeletorServidores();
            iniciar();
        };
    </script>
