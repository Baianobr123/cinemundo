<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cine Mundo BHS</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #060913;
            --bg-card: #0d1326;
            --bg-sidebar: #090e1c;
            --accent-red: #e50914;
            --text-main: #ffffff;
            --text-muted: #7887a0;
            --accent-green: #2ecc71;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 50px; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }

        header {
            background: #090e1c;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 1px solid #141c33;
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            cursor: pointer;
            white-space: nowrap;
        }
        .logo span { color: var(--accent-red); }

        .nav-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            width: 100%;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-red) transparent;
        }
        .nav-tabs::-webkit-scrollbar { height: 3px; }
        .nav-tabs::-webkit-scrollbar-thumb { background: var(--accent-red); border-radius: 10px; }

        .tab-btn {
            background: #0d1326;
            border: 1px solid #1a243d;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            flex-shrink: 0;
        }
        .tab-btn.active, .tab-btn:hover {
            color: #fff;
            background: var(--accent-red);
            border-color: var(--accent-red);
        }

        .search-box { width: 100%; }
        .search-box input {
            width: 100%;
            padding: 11px 18px;
            background: #0d1326;
            border: 1px solid #1a243d;
            border-radius: 25px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
        }
        .search-box input:focus { border-color: var(--accent-red); }

        .container { max-width: 1600px; margin: 20px auto; padding: 0 15px; }

        .section-title {
            font-size: 1.25rem;
            margin-bottom: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: var(--accent-red);
            border-radius: 2px;
        }

        .back-link {
            background: #0d1326;
            color: #fff;
            border: 1px solid #1a243d;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 14px;
            display: inline-block;
        }
        .back-link:hover { border-color: var(--accent-red); }

        /* Categorias */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
        }
        .category-card {
            background: linear-gradient(135deg, #141c33, #0d1326);
            padding: 22px 14px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #1a243d;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }
        .category-card:hover {
            border-color: var(--accent-red);
            transform: translateY(-3px);
        }
        .category-name { font-size: 0.95rem; font-weight: 600; }
        .category-count { font-size: 0.75rem; color: var(--text-muted); }

        /* Conteúdo */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }
        .content-card {
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #141c33;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .content-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-red);
        }
        .content-card-img {
            width: 100%;
            aspect-ratio: 2/3;
            background: #141c33;
            position: relative;
            overflow: hidden;
        }
        .content-card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .content-card-img .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(229,9,20,0.9);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
        }
        .content-card-info { padding: 10px; }
        .content-card-title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        .content-card-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-size: 1rem;
            grid-column: 1 / -1;
        }

        .load-more-wrap {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px 0 10px;
        }
        .load-more-btn {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .load-more-btn:hover { opacity: 0.9; transform: scale(1.03); }
        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* PLAYER */
        #view-player { display: none; }
        .back-btn {
            background: #0d1326;
            color: #fff;
            border: 1px solid #1a243d;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-block;
        }
        .back-btn:hover { border-color: var(--accent-red); }

        .player-view {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        #mega-player {
            width: 100%;
            aspect-ratio: 16/9;
            border: 0;
            display: block;
            background: #000;
        }
        .player-info { padding: 16px 8px 8px; }
        .player-info h2 { font-size: 1.35rem; margin-bottom: 6px; }
        .player-info p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }

        .episodes-panel {
            background: var(--bg-sidebar);
            border-radius: 12px;
            border: 1px solid #141c33;
            max-height: 480px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .episodes-panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid #141c33;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .season-select {
            background: #0d1326;
            color: #fff;
            border: 1px solid #1a243d;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }
        .episodes-list {
            overflow-y: auto;
            flex: 1;
            padding: 10px;
        }
        .ep-item {
            padding: 11px 12px;
            background: #0d1326;
            margin-bottom: 6px;
            border-radius: 8px;
            font-size: 0.85rem;
            border: 1px solid #1a243d;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.15s;
        }
        .ep-item:hover, .ep-item.active {
            border-color: var(--accent-red);
            background: #141c33;
        }
        .ep-item.active { font-weight: 600; }
        .ep-num {
            color: var(--accent-red);
            font-weight: 700;
            font-size: 0.8rem;
            min-width: 28px;
        }

        @media (min-width: 992px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 14px 4%;
            }
            .header-top { width: auto; }
            .logo { font-size: 1.5rem; }
            .nav-tabs { width: auto; overflow: visible; }
            .search-box { width: 280px; }
            .category-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 18px;
            }
            .content-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 22px;
            }
            .player-view {
                grid-template-columns: 1fr 340px;
                gap: 24px;
            }
            .back-btn { width: auto; }
        }
    </style>
</head>

    <header>
        <div class="header-top">
            <div class="logo" onclick="voltarHome()">Cine Mundo<span> BHS</span></div>
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" data-tab="trending" onclick="mudarAba('trending', this)">Em Alta</button>
            <button class="tab-btn" data-tab="movie" onclick="mudarAba('movie', this)">Filmes</button>
            <button class="tab-btn" data-tab="tv" onclick="mudarAba('tv', this)">Séries</button>
            <button class="tab-btn" data-tab="anime" onclick="mudarAba('anime', this)">Animes</button>
            <button class="tab-btn" data-tab="tvlive" onclick="mudarAba('tvlive', this)">TV Embed</button>
            <button class="tab-btn" data-tab="livres" onclick="mudarAba('livres', this)">Canais Livres</button>
        </div>
        <div class="search-box">
            <input type="text" id="search" placeholder="Buscar filme ou série..." onkeydown="if(event.key==='Enter') fazerBusca()">
        </div>
    </header>

    <div class="container">
        <div id="view-catalogo">
            <button class="back-link" id="btn-voltar-cat" style="display:none;" onclick="voltarCategorias()">← Voltar às Categorias</button>
            <h2 class="section-title" id="titulo-pagina">Em Alta Hoje</h2>
            <div id="main-grid" class="content-grid">
                <div class="loading">Carregando...</div>
            </div>
        </div>

        <div id="view-player">
            <button class="back-btn" onclick="fecharPlayer()">← Voltar ao Catálogo</button>
            <div class="player-view">
                <div>
                    <div class="video-container">
                        <video id="native-live" controls playsinline style="width:100%;aspect-ratio:16/9;background:#000;display:none;border-radius:8px;"></video>
                        <iframe id="mega-player" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="no-referrer"></iframe>
                    </div>
                    <div class="player-info">
                        <h2 id="player-title">Título</h2>
                        <p id="player-overview"></p>
                    </div>
                </div>
                <div class="episodes-panel" id="episodes-panel" style="display:none;">
                    <div class="episodes-panel-header">
                        <span>Episódios</span>
                        <select class="season-select" id="season-select" onchange="carregarEpisodiosTemporada()"></select>
                    </div>
                    <div class="episodes-list" id="episodes-list"></div>
                </div>
            </div>
        </div>
    </div>

        async function carregarTrending() {
            const grid = document.getElementById("main-grid");
            grid.className = "content-grid";
            grid.innerHTML = '<div class="loading">Carregando...</div>';
            idsJaMostrados = new Set();
            paginaAtual = 1;

            try {
                // Pega day + week pra ter mais conteúdo
                const [day, week] = await Promise.all([
                    tmdb("/trending/all/day"),
                    tmdb("/trending/all/week")
                ]);
                grid.innerHTML = "";
                const juntos = [...(day.results || []), ...(week.results || [])];
                renderItens(juntos, grid, true);
                if (!grid.children.length) {
                    grid.innerHTML = '<div class="loading">Nenhum conteúdo encontrado.</div>';
                }
            } catch (e) {
                console.error(e);
                grid.innerHTML = '<div class="loading">Erro ao carregar. Verifique sua conexão.</div>';
            }
        }

        async function carregarPorGenero(reset = true) {
            if (carregando) return;
            carregando = true;

            const grid = document.getElementById("main-grid");
            grid.className = "content-grid";

            if (reset) {
                paginaAtual = 1;
                idsJaMostrados = new Set();
                grid.innerHTML = '<div class="loading">Carregando títulos...</div>';
            }

            try {
                const mediaType = generoAtivo.mediaType; // movie | tv
                let data;

                if (generoAtivo.isAnime) {
                    data = await tmdb("/discover/tv", {
                        page: paginaAtual,
                        with_genres: "16",
                        with_original_language: "ja",
                        sort_by: "popularity.desc"
                    });
                } else if (generoAtivo.id) {
                    data = await tmdb(`/discover/${mediaType}`, {
                        page: paginaAtual,
                        with_genres: String(generoAtivo.id),
                        sort_by: "popularity.desc"
                    });
                } else {
                    // Populares
                    data = await tmdb(`/${mediaType}/popular`, { page: paginaAtual });
                }

                totalPaginas = data.total_pages || 1;
                if (reset) grid.innerHTML = "";

                // Remove botão load more antigo
                const oldBtn = grid.querySelector(".load-more-wrap");
                if (oldBtn) oldBtn.remove();

                const results = data.results || [];
                renderItens(results, grid, mediaType === "movie");

                if (reset && !grid.querySelector(".content-card")) {
                    grid.innerHTML = '<div class="loading">Nenhum título nesta categoria.</div>';
                } else if (paginaAtual < Math.min(totalPaginas, 40)) {
                    // Máx 40 páginas (~800 itens) pra não explodir
                    const wrap = document.createElement("div");
                    wrap.className = "load-more-wrap";
                    const btn = document.createElement("button");
                    btn.className = "load-more-btn";
                    btn.textContent = `Carregar mais (pág. ${paginaAtual + 1})`;
                    btn.onclick = async () => {
                        btn.disabled = true;
                        btn.textContent = "Carregando...";
                        paginaAtual++;
                        await carregarPorGenero(false);
                    };
                    wrap.appendChild(btn);
                    grid.appendChild(wrap);
                }
            } catch (e) {
                console.error(e);
                if (reset) {
                    grid.innerHTML = '<div class="loading">Erro ao carregar categoria.</div>';
                }
            }
            carregando = false;
        }

        function renderItens(results, grid, forceMovie = null) {
            results.forEach(item => {
                if (item.adult) return;
                const mediaType = item.media_type || (forceMovie === true ? "movie" : forceMovie === false ? "tv" : (item.title ? "movie" : "tv"));
                if (mediaType !== "movie" && mediaType !== "tv") return;

                const key = `${mediaType}_${item.id}`;
                if (idsJaMostrados.has(key)) return;
                idsJaMostrados.add(key);

                const titulo = item.title || item.name || "Sem título";
                const ano = (item.release_date || item.first_air_date || "").substring(0, 4);
                const poster = item.poster_path ? TMDB_IMG + item.poster_path : "";
                const rating = item.vote_average ? item.vote_average.toFixed(1) : "-";

                const card = document.createElement("div");
                card.className = "content-card";
                card.onclick = () => abrirConteudo(item.id, mediaType, titulo, item.overview || "");
                card.innerHTML = `
                    <div class="content-card-img">
                        <img src="${poster || 'https://via.placeholder.com/300x450?text=Sem+Capa'}" loading="lazy" alt="${titulo}" onerror="this.src='https://via.placeholder.com/300x450?text=Sem+Capa'">
                        <span class="badge">${mediaType === "movie" ? "Filme" : "Série"}</span>
                    </div>
                    <div class="content-card-info">
                        <div class="content-card-title">${titulo}</div>
                        <div class="content-card-meta">${ano || "----"} • ⭐ ${rating}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function fazerBusca() {
            const termo = document.getElementById("search").value.trim();
            if (!termo) {
                mudarAba(abaAtual, document.querySelector(`.tab-btn[data-tab="${abaAtual}"]`));
                return;
            }

            modoAtual = "busca";
            generoAtivo = null;
            document.getElementById("btn-voltar-cat").style.display = "none";
            idsJaMostrados = new Set();

            const grid = document.getElementById("main-grid");
            grid.className = "content-grid";
            grid.innerHTML = '<div class="loading">Buscando...</div>';
            document.getElementById("titulo-pagina").innerText = `Resultados: "${termo}"`;

            try {
                // Busca várias páginas pra trazer mais resultados
                const pages = await Promise.all([
                    tmdb("/search/multi", { query: termo, page: 1 }),
                    tmdb("/search/multi", { query: termo, page: 2 }),
                    tmdb("/search/multi", { query: termo, page: 3 })
                ]);

                grid.innerHTML = "";
                const all = pages.flatMap(p => p.results || []);
                const filtered = all.filter(i =>
                    (i.media_type === "movie" || i.media_type === "tv") && !i.adult
                );

                renderItens(filtered, grid, null);

                // Também busca canais de TV
                const termoL = termo.toLowerCase();
                const canais = (window.EMBEDTV_CHANNELS || []).filter(c =>
                    c.name.toLowerCase().includes(termoL) ||
                    (c.category || "").toLowerCase().includes(termoL) ||
                    c.id.toLowerCase().includes(termoL)
                );
                canais.forEach(ch => {
                    const card = document.createElement("div");
                    card.className = "content-card";
                    card.onclick = () => abrirCanalTV(ch);
                    card.innerHTML = `
                        <div class="content-card-img">
                            <img src="${ch.logo}" loading="lazy" alt="${ch.name}" onerror="this.src='https://via.placeholder.com/300x450?text=TV'">
                            <span class="badge">AO VIVO</span>
                        </div>
                        <div class="content-card-info">
                            <div class="content-card-title">${ch.name}</div>
                            <div class="content-card-meta">${ch.category || "TV"}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                if (!grid.querySelector(".content-card")) {
                    grid.innerHTML = '<div class="loading">Nenhum resultado encontrado.</div>';
                }
            } catch (e) {
                grid.innerHTML = '<div class="loading">Erro na busca.</div>';
            }
        }

        async function carregarTemporadas(tmdbId) {
            const select = document.getElementById("season-select");
            select.innerHTML = "";
            document.getElementById("episodes-list").innerHTML = '<div class="loading" style="padding:20px;">Carregando...</div>';

            try {
                const data = await tmdb(`/tv/${tmdbId}`);
                const seasons = (data.seasons || []).filter(s => s.season_number > 0);

                if (!seasons.length) {
                    select.innerHTML = '<option value="1">Temporada 1</option>';
                } else {
                    seasons.forEach(s => {
                        const opt = document.createElement("option");
                        opt.value = s.season_number;
                        opt.textContent = `Temporada ${s.season_number}` + (s.episode_count ? ` (${s.episode_count} eps)` : "");
                        select.appendChild(opt);
                    });
                }

                if (data.overview) document.getElementById("player-overview").innerText = data.overview;
                if (data.name) document.getElementById("player-title").innerText = data.name;

                await carregarEpisodiosTemporada();
            } catch (e) {
                select.innerHTML = '<option value="1">Temporada 1</option>';
                tocarEpisodio(1, 1);
                document.getElementById("episodes-list").innerHTML = `
                    <div class="ep-item active" onclick="tocarEpisodio(1,1)">
                        <span class="ep-num">E1</span> Episódio 1
                    </div>`;
            }
        }

        async function carregarEpisodiosTemporada() {
            const season = parseInt(document.getElementById("season-select").value) || 1;
            const list = document.getElementById("episodes-list");
            list.innerHTML = '<div class="loading" style="padding:20px;">Carregando episódios...</div>';

            try {
                const data = await tmdb(`/tv/${itemAtual.id}/season/${season}`);
                const eps = data.episodes || [];
                list.innerHTML = "";

                if (!eps.length) {
                    list.innerHTML = `<div class="ep-item active" onclick="tocarEpisodio(${season},1)"><span class="ep-num">E1</span> Episódio 1</div>`;
                    tocarEpisodio(season, 1);
                    return;
                }

                eps.forEach((ep, idx) => {
                    const el = document.createElement("div");
                    el.className = "ep-item" + (idx === 0 ? " active" : "");
                    el.innerHTML = `<span class="ep-num">E${ep.episode_number}</span> ${ep.name || "Episódio " + ep.episode_number}`;
                    el.onclick = () => {
                        document.querySelectorAll(".ep-item").forEach(x => x.classList.remove("active"));
                        el.classList.add("active");
                        tocarEpisodio(season, ep.episode_number);
                    };
                    list.appendChild(el);
                });
                tocarEpisodio(season, eps[0].episode_number);
            } catch (e) {
                list.innerHTML = `<div class="ep-item active" onclick="tocarEpisodio(${season},1)"><span class="ep-num">E1</span> Episódio 1</div>`;
                tocarEpisodio(season, 1);
            }
        }

        }

        function tocarCanalLivre(ch) {
            itemAtual = { id: ch.name, type: "livre", title: ch.name };
            document.getElementById("view-catalogo").style.display = "none";
            document.getElementById("view-player").style.display = "block";
            document.getElementById("player-title").innerText = ch.name;
            document.getElementById("player-overview").innerText = (ch.category || "Canais Livres") + " • IPTV público (sem ads do EmbedTV)";
            document.getElementById("episodes-panel").style.display = "none";

            // Hide iframe, show native video
            const iframe = document.getElementById("mega-player");
            const video = document.getElementById("native-live");
            iframe.style.display = "none";
            iframe.src = "about:blank";
            video.style.display = "block";

            if (hlsLive) {
                try { hlsLive.destroy(); } catch(e) {}
                hlsLive = null;
            }
            video.pause();
            video.removeAttribute("src");
            video.load();

            const url = ch.url;
            if (window.Hls && Hls.isSupported() && (url.indexOf(".m3u8") !== -1 || url.indexOf("m3u8") !== -1)) {
                hlsLive = new Hls({ enableWorker: true, maxBufferLength: 30 });
                hlsLive.loadSource(url);
                hlsLive.attachMedia(video);
                hlsLive.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(function(){});
                });
                hlsLive.on(Hls.Events.ERROR, function(ev, data) {
                    if (data.fatal) {
                        document.getElementById("player-overview").innerText = "Stream offline ou bloqueado. Tente outro canal.";
                    }
                });
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = url;
                video.play().catch(function(){});
            } else {
                // try direct
                video.src = url;
                video.play().catch(function(){
                    document.getElementById("player-overview").innerText = "Não foi possível reproduzir este stream no navegador.";
                });
            }
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
