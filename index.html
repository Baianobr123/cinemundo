<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Mundo BHS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #0b0e14; color: #fff; padding: 20px; }
        
        header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid #1a2332; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 24px; font-weight: bold; }
        .logo span { color: #e50914; }

        .btn-voltar { background: #1a2332; color: #fff; border: 1px solid #2d3b53; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-bottom: 20px; display: inline-block; }
        .btn-voltar:hover { background: #2d3b53; }

        .grid-categorias { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .card-categoria { background: #121829; border: 1px solid #1a2332; padding: 20px; border-radius: 8px; cursor: pointer; text-align: center; transition: 0.2s; }
        .card-categoria:hover { border-color: #e50914; transform: translateY(-3px); }
        .card-categoria h3 { font-size: 14px; margin-bottom: 8px; color: #fff; }
        .card-categoria span { font-size: 12px; color: #64748b; }

        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .card-item { background: #121829; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid #1a2332; transition: 0.2s; }
        .card-item:hover { border-color: #e50914; transform: scale(1.02); }
        .card-item img { width: 100%; height: 210px; object-fit: cover; background: #1a2332; }
        .card-item h4 { font-size: 12px; padding: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        
        #titulo-secao { margin-bottom: 15px; font-size: 18px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">CINE MUNDO <span>BHS</span></div>
    </header>

    <div id="painel-conteudo">
        <h2 id="titulo-secao">Categorias do Servidor</h2>
        <div id="grid-principal" class="grid-categorias">
            <p style="color: #64748b;">Carregando dados...</p>
        </div>
    </div>

    <script src="lista.js"></script>
    <script>
        let dadosCompletos = [];

        document.addEventListener("DOMContentLoaded", async () => {
            if (typeof carregarDadosXtream === "function") {
                dadosCompletos = await carregarDadosXtream();
                renderizarCategorias();
            }
        });

        function renderizarCategorias() {
            const container = document.getElementById("grid-principal");
            const titulo = document.getElementById("titulo-secao");
            
            container.className = "grid-categorias";
            titulo.innerText = "Categorias do Servidor";

            // Agrupa por grupo/categoria
            const gruposMap = {};
            dadosCompletos.forEach(item => {
                const g = item.group || item.categoria || "Geral";
                gruposMap[g] = (gruposMap[g] || 0) + 1;
            });

            let html = "";
            for (const [nome, qtd] of Object.entries(gruposMap)) {
                html += `
                    <div class="card-categoria" onclick="abrirCategoria('${nome.replace(/'/g, "\\'")}')">
                        <h3>${nome}</h3>
                        <span>${qtd} título(s)</span>
                    </div>
                `;
            }

            container.innerHTML = html || "<p>Nenhum conteúdo encontrado.</p>";
        }

        function abrirCategoria(nomeCategoria) {
            const container = document.getElementById("grid-principal");
            const painel = document.getElementById("painel-conteudo");

            const itens = dadosCompletos.filter(item => item.group === nomeCategoria || item.categoria === nomeCategoria);

            let html = `
                <button class="btn-voltar" onclick="renderizarCategorias()">← Voltar para Categorias</button>
                <h2 style="margin-bottom: 15px; font-size: 18px;">${nomeCategoria}</h2>
                <div class="grid-cards">
            `;

            if (itens.length === 0) {
                html += `<p style="color: #64748b;">Nenhum item nesta categoria.</p>`;
            } else {
                itens.forEach(item => {
                    const capa = item.logo || item.cover || item.stream_icon || 'https://via.placeholder.com/150';
                    const nome = item.nome || item.name || 'Sem título';
                    const url = item.url || item.stream_url || '#';

                    html += `
                        <div class="card-item" onclick="window.open('${url}', '_blank')">
                            <img src="${capa}" alt="${nome}" onerror="this.src='https://via.placeholder.com/150';">
                            <h4>${nome}</h4>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            painel.innerHTML = html;
        }
    </script>
</body>
</html>
